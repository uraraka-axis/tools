<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">
<title>長崎新聞 紙面ビューワー</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
  }
  body {
    font-family: "Inter", "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    font-size: 14px;
    background: #fff;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  .screen {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* 上部ロゴエリア */
  .logo-area {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding-top: 4dvh;
    min-height: 0;
  }
  .logo-area img {
    height: min(44dvh, 460px);
    width: auto;
    max-width: 60vw;
    object-fit: contain;
  }
  /* 下部ボタンエリア */
  .menu {
    flex: 0 0 auto;
    width: 100%;
    max-width: 820px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: min(9vw, 74px);
    padding-bottom: 7dvh;
  }
  .menu a {
    display: block;
    border-radius: 50%;
    line-height: 0;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .menu a:active {
    transform: scale(0.94);
    filter: brightness(0.95);
  }
  @media (hover: hover) {
    .menu a:hover {
      transform: scale(1.05);
    }
  }
  .menu img {
    width: 100%;
    height: auto;
    border-radius: 50%;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
  }
  .btn-sub {
    width: min(19vw, 20dvh, 150px);
  }
  .btn-main {
    width: min(28vw, 29dvh, 220px);
  }
  /* 横向き（landscape）でもバランスを保つ */
  @media (orientation: landscape) {
    .logo-area img {
      height: min(48dvh, 400px);
    }
    .menu {
      padding-bottom: 5dvh;
    }
  }
</style>
</head>
<body>
<div class="screen">

  <div class="logo-area">
    <img src="images/logo-nagasaki-np.png?v=20260821b" alt="長崎新聞">
  </div>

  <nav class="menu" aria-label="メニュー">
    <a href="https://www.nagasaki-np.co.jp/" class="btn-sub" id="btn-past">
      <img src="images/past-np.png?v=20260821b" alt="過去の紙面を読む">
    </a>
    <a href="https://www.nagasaki-np.co.jp/" class="btn-main" id="btn-today">
      <img src="images/today-np.png?v=20260821b" alt="今日の紙面を読む">
    </a>
    <a href="https://tablet.viewn.co.jp/login/shop" class="btn-sub" id="btn-ebook">
      <img src="images/e-book.png?v=20260821b" alt="電子書籍を読む">
    </a>
  </nav>

</div>
</body>
</html>
